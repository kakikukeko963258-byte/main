name: Export saved verification images
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  export:
    runs-on: macos-26
    steps:
      - name: Download completed UI test results
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38941387638 --repo "$GITHUB_REPOSITORY" --name visual-verification --dir verification
      - name: Export screenshots
        run: xcrun xcresulttool export attachments --path verification/TestResults.xcresult --output-path screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
