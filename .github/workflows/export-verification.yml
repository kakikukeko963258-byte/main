name: Export saved verification images
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run containing visual-verification
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  export:
    runs-on: macos-26
    steps:
      - name: Download completed UI test results
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
        run: gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name visual-verification --dir verification
      - name: Export screenshots
        run: xcrun xcresulttool export attachments --path verification/TestResults.xcresult --output-path screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
