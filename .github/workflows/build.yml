name: Build public IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_ui_checks:
        description: Skip simulator checks when explicitly requested
        type: boolean
        default: false
      only_listening:
        description: Run the focused chapter playback and word highlighting UI test
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: public-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    env:
      RUN_UI_CHECKS: ${{ !contains(github.event.head_commit.message, '[skip ui]') && !inputs.skip_ui_checks }}
      ONLY_LISTENING: ${{ inputs.only_listening || false }}
      ONLY_CHARGING: ${{ contains(github.event.head_commit.message, '[charging]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Verify charge prediction
        run: |
          swiftc Main/Charging/ChargeEstimator.swift scripts/ChargeEstimatorChecks.swift -o /tmp/charge-checks
          /tmp/charge-checks
      - name: Build iPhone app
        run: |
          set -euo pipefail
          xcodebuild -project main.xcodeproj -scheme main -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package AltStore IPA
        run: |
          ruby -e "require 'xcodeproj'" || gem install xcodeproj --no-document
          bash scripts/build-embedded-wda.sh
          bash scripts/package-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: main-ipa
          path: dist/main.ipa
      - name: Select simulator
        if: env.RUN_UI_CHECKS == 'true'
        timeout-minutes: 3
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          devices = [d for runtime, values in data['devices'].items() if 'iOS' in runtime for d in values if 'iPhone' in d['name']]
          device = next((d for d in devices if d['name'] == 'iPhone 17 Pro'), devices[0])['udid']
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SIMULATOR_ID=' + device + '\n')
          PY
      - name: Boot preconfigured iPhone
        if: env.RUN_UI_CHECKS == 'true'
        timeout-minutes: 1
        run: |
          xcrun simctl boot "$SIMULATOR_ID"
      - name: Verify folder navigation and capture screens
        if: env.RUN_UI_CHECKS == 'true'
        timeout-minutes: 18
        run: |
          set -euo pipefail
          xcrun simctl io "$SIMULATOR_ID" recordVideo --codec=h264 motion.mov > /tmp/recording.log 2>&1 &
          RECORD_PID=$!
          trap 'kill -INT "$RECORD_PID" 2>/dev/null || true' EXIT
          TEST_FILTER=()
          if [ "$ONLY_CHARGING" = "true" ]; then
            TEST_FILTER=(-only-testing:mainUITests/HomeUITests/testChargingMonitor -only-testing:mainUITests/HomeUITests/testListeningChapterPlaybackAndHighlight)
          fi
          if [ "$ONLY_LISTENING" = "true" ]; then
            TEST_FILTER=(-only-testing:mainUITests/HomeUITests/testListeningChapterPlaybackAndHighlight)
          fi
          xcodebuild test -project main.xcodeproj -scheme main -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 -derivedDataPath simulator-build -resultBundlePath TestResults.xcresult "${TEST_FILTER[@]}" CODE_SIGNING_ALLOWED=NO
          kill -INT "$RECORD_PID" 2>/dev/null || true
          wait "$RECORD_PID" || true
          trap - EXIT
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots
      - uses: actions/upload-artifact@v4
        timeout-minutes: 3
        if: always() && env.RUN_UI_CHECKS == 'true'
        with:
          name: visual-verification
          compression-level: 0
          path: |
            screenshots/
            TestResults.xcresult
            motion.mov
      - name: Publish downloadable build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/main.ipa --title "main build ${GITHUB_RUN_NUMBER}" --notes "PC File Bridge in slot 1, with the existing animated home and File Provider extension. Install with configured AltForge Remote (re-signing required)." --target "$GITHUB_SHA"

