name: Build public IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-ipa
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build iPhone app
        run: |
          set -euo pipefail
          xcodebuild -project main.xcodeproj -scheme main -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package AltStore IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/main.app dist/Payload/
          cd dist
          /usr/bin/zip -qr main.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: main-ipa
          path: dist/main.ipa
      - name: Select simulator
        run: |
          xcrun simctl list devices available -j > /tmp/devices.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('/tmp/devices.json'))
          devices = [d for runtime, values in data['devices'].items() if 'iOS' in runtime for d in values if 'iPhone' in d['name']]
          device = next((d for d in devices if 'iPhone 17 Pro' == d['name']), devices[0])
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SIMULATOR_ID=' + device['udid'] + '\n')
          PY
      - name: Verify folder navigation and capture screens
        timeout-minutes: 8
        run: |
          set -euo pipefail
          xcodebuild test -project main.xcodeproj -scheme main -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 -derivedDataPath simulator-build -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-verification
          path: |
            screenshots/
            TestResults.xcresult
      - name: Publish downloadable build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/main.ipa --title "main build ${GITHUB_RUN_NUMBER}" --notes "Reference home layout, 32 numbered apps with animated folders and Liquid Glass. Install with configured AltForge Remote (re-signing required)." --target "$GITHUB_SHA"

